name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify source
        run: yarn run verify

      - name: Audit dependencies
        run: yarn audit --level high

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: yarn app:dir:linux
          - os: macos-latest
            command: yarn app:dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: ${{ matrix.command }}
